name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: transport/go.mod
          cache-dependency-path: transport/go.sum
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: go vet ./...
        working-directory: transport
